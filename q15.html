<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Cart Counter<span id="count"></span> </p>
    <button  onclick="inc()">add</button>
    <button  onclick="dec()">deduct</button>
    <button onclick="reset()">reset</button>
    <script>
        let count = 0;
        function inc() {
            count++
            document.getElementById("count").innerText = count
        }
        function dec() {
            count--
            document.getElementById("count").innerText = count
        }
        function reset() {
            count=0
            document.getElementById("count").innerText = count
        }
        
    </script>
    
</body>
